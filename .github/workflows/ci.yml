name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API · lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev,llm]"
      - name: Format
        run: ruff format --check src tests ../../tools
      - name: Lint
        run: ruff check src tests ../../tools
      - name: Types
        run: mypy
      - name: Tests (incl. benchmark regression floor)
        run: pytest --cov=derle --cov-report=term-missing:skip-covered
      - name: API contract is in sync with the web client
        run: |
          python - <<'PY'
          import json, sys
          from derle.main import create_app
          live = create_app().openapi()
          with open("../web/openapi.json", encoding="utf-8") as f:
              saved = json.load(f)
          if live != saved:
              sys.exit("apps/web/openapi.json is out of date: run `npm run gen:api` in apps/web")
          print("OpenAPI contract up to date")
          PY

  web:
    name: Web · types, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -e "apps/api"
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
        working-directory: apps/web
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  docker:
    name: Docker · build and smoke test
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait api
      - run: docker compose up -d web
      - name: Web answers and proxies the API
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/v1/health && break
            sleep 2
          done
          curl -fsS http://localhost:3000/ | grep -q "Dağınık defterden"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
