[project]
name = "derle"
version = "0.1.0"
description = "Turns scattered spreadsheets into a clean, persistent, explainable database."
readme = "../../README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "rapidfuzz>=3.9",
    "sqlglot>=25",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "hypothesis>=6.112",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/derle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = [
    "PLR0911", # many returns are natural in parsers
    "PLR0912",
    "PLR2004", # magic values: thresholds are documented inline
    "PLR0913", # pipeline steps and FastAPI endpoints are keyword-heavy by nature
    "PLR0917",
    "RUF001",  # Turkish characters are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "N802"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["derle"]

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true
